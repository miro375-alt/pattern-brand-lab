<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>Pattern Brand Lab</title>
<style>
:root{
  color-scheme: light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --border:rgba(11,11,11,.10); --s1:#2a78d6; --crit:#d03b3b;
}
@media (prefers-color-scheme: dark){
  :root{ color-scheme: dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#fff; --ink2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --border:rgba(255,255,255,.10); --s1:#3987e5; --crit:#e66767; }
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--page);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI","Apple SD Gothic Neo",sans-serif}
#gate{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:16px;padding:40px 36px;width:100%;max-width:380px;box-shadow:0 8px 40px rgba(0,0,0,.06)}
.logo{font-size:13px;letter-spacing:.18em;color:var(--muted);text-transform:uppercase;margin-bottom:6px}
h1{font-size:22px;margin-bottom:22px}
label{display:block;font-size:12.5px;color:var(--ink2);margin:14px 0 6px;font-weight:600}
input{width:100%;padding:11px 13px;border:1px solid var(--grid);border-radius:9px;background:var(--page);color:var(--ink);font-size:15px}
input:focus{outline:2px solid var(--s1);outline-offset:-1px;border-color:transparent}
button{width:100%;margin-top:22px;padding:12px;border:none;border-radius:9px;background:var(--s1);color:#fff;font-size:15px;font-weight:700;cursor:pointer}
button:disabled{opacity:.5;cursor:wait}
#err{color:var(--crit);font-size:13px;margin-top:12px;min-height:18px}
.note{font-size:11.5px;color:var(--muted);margin-top:18px;line-height:1.6}
#app{display:none;width:100%;height:100vh;border:none}
</style>
</head>
<body>

<div id="gate">
  <form class="card" id="loginForm">
    <div class="logo">Pattern Brand Lab</div>
    <h1>업무 공간</h1>
    <label for="uname">이름 (작성자 표시용)</label>
    <input id="uname" autocapitalize="none" spellcheck="false" placeholder="예: 정우">
    <label for="uid">아이디</label>
    <input id="uid" autocomplete="username" autocapitalize="none" spellcheck="false">
    <label for="upw">비밀번호</label>
    <input id="upw" type="password" autocomplete="current-password">
    <button id="goBtn" type="submit">열기</button>
    <div id="err"></div>
    <div class="note">문서·업무툴은 AES-256으로 암호화되어 있으며 올바른 계정 정보로만 열립니다. 메모·캘린더는 이 브라우저에만 저장됩니다.</div>
  </form>
</div>

<iframe id="app" title="workspace"></iframe>

<script>
const $ = id => document.getElementById(id);
const enc = new TextEncoder(), dec = new TextDecoder();
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let CREDS = null;
const cache = {};

async function derive(id, pw, salt, iter){
  const mat = await crypto.subtle.importKey('raw', enc.encode(id + ':' + pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'},
    mat, {name:'AES-GCM', length:256}, false, ['decrypt']);
}
async function fetchEnc(src){
  if (!cache[src]) cache[src] = await (await fetch(src)).json();
  return cache[src];
}
async function decryptDoc(src){
  const d = await fetchEnc(src);
  const key = await derive(CREDS.id, CREDS.pw, b64d(d.salt), d.iter);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: b64d(d.iv)}, key, b64d(d.ct));
  return dec.decode(pt);
}

$('uname').value = localStorage.getItem('pbl.name') || '';
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('goBtn'); btn.disabled = true; $('err').textContent = '';
  try {
    CREDS = { id: $('uid').value.trim(), pw: $('upw').value };
    const html = await decryptDoc('docs/app.enc.json'); // 잘못된 계정이면 여기서 throw
    $('gate').style.display = 'none';
    const app = $('app'); app.style.display = 'block';
    const name = $('uname').value.trim() || localStorage.getItem('pbl.name') || '나';
    localStorage.setItem('pbl.name', name);
    app.addEventListener('load', () => {
      app.contentWindow.postMessage({t:'init', id: CREDS.id, pw: CREDS.pw, name}, '*');
    }, {once: true});
    app.srcdoc = html;
  } catch {
    CREDS = null;
    $('err').textContent = '아이디 또는 비밀번호가 올바르지 않습니다.';
  } finally { btn.disabled = false; }
});

/* 앱(iframe)과의 복호화 브리지 */
window.addEventListener('message', async e => {
  const m = e.data || {};
  if (m.t === 'getdoc' && CREDS && /^docs\/[a-z0-9]+\.enc\.json$/.test(m.src)) {
    try { $('app').contentWindow.postMessage({t:'dochtml', src:m.src, html: await decryptDoc(m.src)}, '*'); }
    catch { $('app').contentWindow.postMessage({t:'dochtml', src:m.src, html:'<p style="font-family:sans-serif;padding:20px">복호화 실패</p>'}, '*'); }
  }
  if (m.t === 'lock') {
    CREDS = null; Object.keys(cache).forEach(k => delete cache[k]);
    const app = $('app'); app.srcdoc = ''; app.style.display = 'none';
    $('gate').style.display = 'flex'; $('upw').value = '';
  }
});
</script>
</body>
</html>
