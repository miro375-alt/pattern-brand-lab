<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a78d6">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Pattern Brand Lab</title>
<style>
@font-face{font-family:'Pretendard';src:url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/woff2/PretendardVariable.woff2') format('woff2-variations');font-weight:45 920;font-display:swap}
:root{
  color-scheme: light;
  --ground:#f7f5f1; --surface:#fdfcfa; --ink:#1a1917; --ink2:#5c5850; --muted:#98938a;
  --line:#e6e2da; --hairline:rgba(26,25,23,.09);
  --acc:#3d5bc9; --acc-ink:#32499f; --ms:#d9642a; --crit:#c93d3d;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --ground:#141311; --surface:#1d1c19; --ink:#f2f0ea; --ink2:#b9b4a9; --muted:#7d786e;
    --line:#2c2a25; --hairline:rgba(242,240,234,.09);
    --acc:#7d95e8; --acc-ink:#a3b4ef; --ms:#e0824e; --crit:#e06d6d;
  }
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%}
body{background:var(--ground);color:var(--ink);font-family:'Pretendard',system-ui,-apple-system,"Apple SD Gothic Neo","Segoe UI",sans-serif}
#gate{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:18px;padding:44px 40px 36px;width:100%;max-width:392px;box-shadow:0 2px 6px rgba(26,25,23,.04), 0 24px 64px rgba(26,25,23,.08);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--acc),var(--ms))}
.logo{font-size:11px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;font-weight:750}
h1{font-size:23px;font-weight:850;letter-spacing:-.01em;margin:6px 0 4px}
.tagline{font-size:12.5px;color:var(--ink2);padding-bottom:20px;border-bottom:1px dashed var(--line);margin-bottom:8px}
label{display:block;font-size:11.5px;color:var(--ink2);margin:16px 0 6px;font-weight:750;letter-spacing:.04em}
input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:var(--ground);color:var(--ink);font-size:15px;font-family:inherit}
input:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
button{width:100%;margin-top:24px;padding:13px;border:none;border-radius:9px;background:var(--acc);color:#fff;font-size:15px;font-weight:750;cursor:pointer;font-family:inherit;transition:filter .12s}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.5;cursor:wait}
#err{color:var(--crit);font-size:13px;margin-top:12px;min-height:18px}
.note{font-size:11px;color:var(--muted);margin-top:16px;line-height:1.65}
#app{display:none;width:100%;height:100vh;border:none}
</style>
</head>
<body>

<div id="gate">
  <form class="card" id="loginForm">
    <div class="logo">Pattern Brand Lab</div>
    <h1>런칭 워크스페이스</h1>
    <div class="tagline">아이와 함께 자라는 무늬를 짓는 일</div>
    <label for="uname">이름 (작성자 표시용)</label>
    <input id="uname" autocapitalize="none" spellcheck="false" placeholder="예: 정우">
    <label for="uid">아이디</label>
    <input id="uid" autocomplete="username" autocapitalize="none" spellcheck="false">
    <label for="upw">비밀번호</label>
    <input id="upw" type="password" autocomplete="current-password">
    <button id="goBtn" type="submit">열기</button>
    <div id="err"></div>
    <div class="note">문서·업무툴은 AES-256으로 암호화되어 있으며 올바른 계정 정보로만 열립니다. 메모·캘린더는 이 브라우저에만 저장됩니다.</div>
  </form>
</div>

<!-- clipboard-write: 앱이 iframe이라 이게 없으면 navigator.clipboard가 막힌다(캡션·블로그 글 복사) -->
<iframe id="app" title="workspace" allow="clipboard-write"></iframe>

<script>
const $ = id => document.getElementById(id);
const enc = new TextEncoder(), dec = new TextDecoder();
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let CREDS = null;
const cache = {};

async function derive(id, pw, salt, iter){
  const mat = await crypto.subtle.importKey('raw', enc.encode(id + ':' + pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'},
    mat, {name:'AES-GCM', length:256}, false, ['decrypt']);
}
async function fetchEnc(src){
  // cache:'reload' — HTTP 캐시를 건너뛰고 항상 새로 받는다(응답은 캐시에 채워지므로 오프라인 폴백은 유지).
  // 없으면 docs/*.enc.json 의 max-age=600 때문에 **배포 직후 10분 동안 이전 앱 뭉치가 뜬다**
  // (2026-08-25 실사고: 우쥬레터 탭이 라이브엔 있는데 화면엔 없었다). sw.js의 /docs/ 네트워크 우선도
  // 요청의 캐시 모드를 물려받으므로 여기서 안 끄면 서비스워커도 못 막는다.
  if (!cache[src]) cache[src] = await (await fetch(src, {cache:'reload'})).json();
  return cache[src];
}
async function decryptDoc(src){
  const d = await fetchEnc(src);
  const key = await derive(CREDS.id, CREDS.pw, b64d(d.salt), d.iter);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: b64d(d.iv)}, key, b64d(d.ct));
  return dec.decode(pt);
}

$('uname').value = localStorage.getItem('pbl.name') || '';
$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('goBtn'); btn.disabled = true; $('err').textContent = '';
  try {
    CREDS = { id: $('uid').value.trim(), pw: $('upw').value };
    const html = await decryptDoc('docs/app.enc.json'); // 잘못된 계정이면 여기서 throw
    $('gate').style.display = 'none';
    const app = $('app'); app.style.display = 'block';
    const name = $('uname').value.trim() || localStorage.getItem('pbl.name') || '나';
    localStorage.setItem('pbl.name', name);
    app.addEventListener('load', () => {
      app.contentWindow.postMessage({t:'init', id: CREDS.id, pw: CREDS.pw, name}, '*');
    }, {once: true});
    app.srcdoc = html;
  } catch {
    CREDS = null;
    $('err').textContent = '아이디 또는 비밀번호가 올바르지 않습니다.';
  } finally { btn.disabled = false; }
});

/* 앱(iframe)과의 복호화 브리지 */
window.addEventListener('message', async e => {
  const m = e.data || {};
  if (m.t === 'getdoc') {
    const reply = html => $('app').contentWindow.postMessage({t:'dochtml', src:m.src, html}, '*');
    if (!CREDS || !/^docs\/[a-z0-9-]+\.enc\.json$/.test(m.src)) { reply('<p style="font-family:sans-serif;padding:20px">문서를 열 수 없습니다.</p>'); return; }
    try { reply(await decryptDoc(m.src)); }
    catch { reply('<p style="font-family:sans-serif;padding:20px">복호화 실패</p>'); }
  }
  if (m.t === 'lock') {
    CREDS = null; Object.keys(cache).forEach(k => delete cache[k]);
    const app = $('app'); app.srcdoc = ''; app.style.display = 'none';
    $('gate').style.display = 'flex'; $('upw').value = '';
  }
});
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
