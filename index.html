<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#2a78d6">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Pattern Brand Lab</title>
<style>
@font-face{font-family:'Pretendard';src:url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/woff2/PretendardVariable.woff2') format('woff2-variations');font-weight:45 920;font-display:swap}
:root{
  color-scheme: light;
  --ground:#f7f5f1; --surface:#fdfcfa; --ink:#1a1917; --ink2:#5c5850; --muted:#98938a;
  --line:#e6e2da; --hairline:rgba(26,25,23,.09);
  --acc:#3d5bc9; --acc-ink:#32499f; --ms:#d9642a; --crit:#c93d3d;
}
@media (prefers-color-scheme: dark){
  :root:where(:not([data-theme="light"])){
    color-scheme: dark;
    --ground:#141311; --surface:#1d1c19; --ink:#f2f0ea; --ink2:#b9b4a9; --muted:#7d786e;
    --line:#2c2a25; --hairline:rgba(242,240,234,.09);
    --acc:#7d95e8; --acc-ink:#a3b4ef; --ms:#e0824e; --crit:#e06d6d;
  }
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;touch-action:manipulation}   /* iOS 더블탭 확대 방지 — 앱(style.css)과 같은 줄. 이유는 그쪽 주석 */
body{background:var(--ground);color:var(--ink);font-family:'Pretendard',system-ui,-apple-system,"Apple SD Gothic Neo","Segoe UI",sans-serif}
#gate{display:flex;align-items:center;justify-content:center;min-height:100vh;min-height:100dvh;padding:24px}
.card{background:var(--surface);border:1px solid var(--hairline);border-radius:18px;padding:44px 40px 36px;width:100%;max-width:392px;box-shadow:0 2px 6px rgba(26,25,23,.04), 0 24px 64px rgba(26,25,23,.08);position:relative;overflow:hidden}
.card::before{content:"";position:absolute;top:0;left:0;right:0;height:3px;background:linear-gradient(90deg,var(--acc),var(--ms))}
.logo{font-size:11px;letter-spacing:.22em;color:var(--muted);text-transform:uppercase;font-weight:750}
h1{font-size:23px;font-weight:850;letter-spacing:-.01em;margin:6px 0 4px}
.tagline{font-size:12.5px;color:var(--ink2);padding-bottom:20px;border-bottom:1px dashed var(--line);margin-bottom:8px}
label{display:block;font-size:11.5px;color:var(--ink2);margin:16px 0 6px;font-weight:750;letter-spacing:.04em}
input{width:100%;padding:11px 13px;border:1px solid var(--line);border-radius:9px;background:var(--ground);color:var(--ink);font-size:15px;font-family:inherit}
input:focus{outline:2px solid var(--acc);outline-offset:-1px;border-color:transparent}
button{width:100%;margin-top:24px;padding:13px;border:none;border-radius:9px;background:var(--acc);color:#fff;font-size:15px;font-weight:750;cursor:pointer;font-family:inherit;transition:filter .12s}
button:hover{filter:brightness(1.08)}
button:disabled{opacity:.5;cursor:wait}
#err{color:var(--crit);font-size:13px;margin-top:12px;min-height:18px}
.note{font-size:11px;color:var(--muted);margin-top:16px;line-height:1.65}
/* ⚠ dvh 먼저가 아니라 vh 다음에 dvh — 지원 안 하는 브라우저는 앞줄(vh)을 쓰고, 되는 브라우저가 뒷줄로 덮는다.
   iOS 사파리에서 100vh 는 「툴바가 숨겨졌을 때의 큰 뷰포트」(아이폰 15 Pro ≈793px)라 실제로 보이는 높이(≈659px)보다
   134px 크다. 이 iframe 이 793px 로 잡히면 그 안의 고정 하단 탭바가 화면 밖(top 724 · 가시 659)으로 밀려
   **탭바가 통째로 안 보였다**(2026-09-08 WebKit 재현). iframe 안의 vh 는 iframe 높이를 따르므로
   여기만 고치면 앱 내부(.shell 100vh·calc(100vh-N))는 자동으로 맞는다 — src/style.css 는 건드릴 필요 없다. */
#app{display:none;width:100%;height:100vh;height:100dvh;border:none}
</style>
</head>
<body>

<div id="gate">
  <form class="card" id="loginForm">
    <div class="logo">Pattern Brand Lab</div>
    <h1>런칭 워크스페이스</h1>
    <div class="tagline">아이와 함께 자라는 무늬를 짓는 일</div>
    <label for="uid">아이디</label>
    <input id="uid" autocomplete="username" autocapitalize="none" spellcheck="false">
    <label for="upw">비밀번호</label>
    <input id="upw" type="password" autocomplete="current-password">
    <button id="goBtn" type="submit">열기</button>
    <div id="err"></div>
    <div class="note">문서·업무툴은 AES-256으로 암호화되어 있으며 올바른 계정 정보로만 열립니다. 이름은 계정에서 자동으로 표시됩니다.</div>
  </form>
  <div class="card" id="wait" hidden>
    <div class="logo">Pattern Brand Lab</div>
    <h1>여는 중…</h1>
    <div class="tagline" style="border-bottom:none;padding-bottom:0">저장된 로그인으로 잠금을 해제하는 중입니다</div>
  </div>
</div>

<!-- clipboard-write: 앱이 iframe이라 이게 없으면 navigator.clipboard가 막힌다(캡션·블로그 글 복사) -->
<iframe id="app" title="workspace" allow="clipboard-write"></iframe>

<script>
const $ = id => document.getElementById(id);
const enc = new TextEncoder(), dec = new TextDecoder();
const b64d = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
let CREDS = null;
const cache = {};

async function derive(id, pw, salt, iter){
  const mat = await crypto.subtle.importKey('raw', enc.encode(id + ':' + pw), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2', salt, iterations:iter, hash:'SHA-256'},
    mat, {name:'AES-GCM', length:256}, false, ['decrypt']);
}
async function fetchEnc(src){
  // cache:'reload' — HTTP 캐시를 건너뛰고 항상 새로 받는다(응답은 캐시에 채워지므로 오프라인 폴백은 유지).
  // 없으면 docs/*.enc.json 의 max-age=600 때문에 **배포 직후 10분 동안 이전 앱 뭉치가 뜬다**
  // (2026-08-25 실사고: 우쥬레터 탭이 라이브엔 있는데 화면엔 없었다). sw.js의 /docs/ 네트워크 우선도
  // 요청의 캐시 모드를 물려받으므로 여기서 안 끄면 서비스워커도 못 막는다.
  if (!cache[src]) cache[src] = await (await fetch(src, {cache:'reload'})).json();
  return cache[src];
}
async function decryptDoc(src){
  const d = await fetchEnc(src);
  const key = await derive(CREDS.id, CREDS.pw, b64d(d.salt), d.iter);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: b64d(d.iv)}, key, b64d(d.ct));
  return dec.decode(pt);
}

/* ── 로그인 유지 (2026-09-17) — 이 기기에서만 하루, 쓸 때마다 다시 하루 ───────────────
   ⚠ **비밀번호를 localStorage에 평문으로 넣지 않는다.** 이 파일은 공개 저장소에 그대로 올라가므로
   설계가 드러나도 안전해야 한다. 그래서 브라우저가 만든 AES-GCM 키를 **추출 불가(extractable:false)**
   로 IndexedDB에 두고, 자격은 그 키로 암호화한 조각만 함께 둔다 — 스크립트가 레코드를 통째로 꺼내도
   키 원문(raw)은 뽑을 수 없고, 다른 기기·다른 오리진으로 옮겨도 쓸 수 없다.
   자격 **원문**을 복구할 수 있게 만든 이유: 앱(iframe)이 init으로 받은 id·pw로 원격 state.json 을
   직접 암·복호화한다(src/core/sync.js). 여기서 키 객체만 넘기면 앱이 자격을 만들지 못해
   **사용자 데이터를 엉뚱한 키로 덮어쓴다.** 「그냥 localStorage에 넣자」로 되돌리지 말 것.
   만료·복호화 실패·잠금(🔒)은 전부 레코드 삭제로 끝난다. IndexedDB가 막힌 환경(사파리 프라이빗 등)
   에서는 조용히 예전 동작(매번 로그인)으로 떨어진다 — 여기서 throw로 화면을 막지 않는다.
   localStorage의 'pbl.keep'은 비밀이 아니라 **만료 시각 힌트**다. IndexedDB는 비동기라 이게 없으면
   레코드가 있어도 로그인 폼이 한 번 깜빡인다. */
const KEEP_MS = 864e5, KEEP_DB = 'pbl-keep', KEEP_ST = 'k', KEEP_ID = 'c';
function keepIdb(mode, fn){
  return new Promise(res => {
    let done = false; const fin = v => { if (!done) { done = true; res(v); } };
    try {
      const rq = indexedDB.open(KEEP_DB, 1);
      rq.onupgradeneeded = () => { try { rq.result.createObjectStore(KEEP_ST); } catch {} };
      rq.onerror = rq.onblocked = () => fin(null);
      rq.onsuccess = () => {
        const db = rq.result;
        try {
          const tx = db.transaction(KEEP_ST, mode), q = fn(tx.objectStore(KEEP_ST));
          tx.oncomplete = () => { fin(q ? q.result : null); db.close(); };
          tx.onerror = tx.onabort = () => { fin(null); db.close(); };
        } catch { fin(null); db.close(); }
      };
    } catch { fin(null); }
  });
}
function keepForget(){
  try { localStorage.removeItem('pbl.keep'); } catch {}
  return keepIdb('readwrite', s => s.delete(KEEP_ID));
}
async function keepSave(creds, name){
  try {
    const wk = await crypto.subtle.generateKey({name:'AES-GCM', length:256}, false, ['encrypt','decrypt']);
    const iv = crypto.getRandomValues(new Uint8Array(12));
    const ct = await crypto.subtle.encrypt({name:'AES-GCM', iv}, wk, enc.encode(JSON.stringify(creds)));
    const exp = Date.now() + KEEP_MS;
    await keepIdb('readwrite', s => s.put({wk, iv, ct, name, exp}, KEEP_ID));
    try { localStorage.setItem('pbl.keep', String(exp)); } catch {}
  } catch {}
}
async function keepLoad(){
  try {
    const r = await keepIdb('readonly', s => s.get(KEEP_ID));
    if (!r || !(r.exp > Date.now())) { keepForget(); return null; }
    const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv: r.iv}, r.wk, r.ct);
    const creds = JSON.parse(dec.decode(pt));
    return creds && creds.id && creds.pw ? { creds, name: r.name || '' } : (keepForget(), null);
  } catch { keepForget(); return null; }
}

/* 다중 계정 (2026-09-02) — docs/users.enc.json 열쇠꾸러미를 입력한 id:pw로 하나씩 열어본다.
   열리면 안에 든 마스터 자격 + 표시 이름으로 진행 — 문서·state 암호화는 마스터 하나라 데이터는 공유된다.
   꾸러미가 없거나 안 열리면 예전처럼 입력값을 마스터로 직접 시도한다(구버전 호환·비상 통로). */
async function unwrapUser(id, pw){
  try {
    const d = await fetchEnc('docs/users.enc.json');
    for (const w of d.wraps ?? []) {
      try {
        const key = await derive(id, pw, b64d(w.salt), d.iter);
        const pt = JSON.parse(dec.decode(await crypto.subtle.decrypt({name:'AES-GCM', iv:b64d(w.iv)}, key, b64d(w.ct))));
        const i = pt.m.indexOf(':');
        return { id: pt.m.slice(0, i), pw: pt.m.slice(i + 1), name: pt.name || '' };
      } catch {}
    }
  } catch {}
  return null;
}
/* 로그인 성공 뒤 실제로 여는 부분 — 폼 제출과 자동 해제가 같은 길을 쓴다.
   자격이 틀리면 decryptDoc이 throw하므로 화면을 바꾸기 전에 걸러진다. */
async function enterApp(creds, name){
  CREDS = creds;
  const html = await decryptDoc('docs/app.enc.json'); // 잘못된 계정이면 여기서 throw
  $('gate').style.display = 'none';
  const app = $('app'); app.style.display = 'block';
  localStorage.setItem('pbl.name', name);
  /* 단축어 진입(?q=카드 문자) — 앱에 넘기고 URL에서 지운다(새로고침 재실행 방지) */
  const q = new URLSearchParams(location.search).get('q') || '';
  if (q) history.replaceState(null, '', location.pathname);
  app.addEventListener('load', () => {
    app.contentWindow.postMessage({t:'init', id: CREDS.id, pw: CREDS.pw, name, q}, '*');
  }, {once: true});
  app.srcdoc = html;
}
function showForm(){ $('wait').hidden = true; $('loginForm').hidden = false; }
function showWait(){ $('loginForm').hidden = true; $('wait').hidden = false; }

$('loginForm').addEventListener('submit', async e => {
  e.preventDefault();
  const btn = $('goBtn'); btn.disabled = true; $('err').textContent = '';
  try {
    const entered = { id: $('uid').value.trim(), pw: $('upw').value };
    const u = await unwrapUser(entered.id, entered.pw);
    const creds = u ? { id: u.id, pw: u.pw } : entered;
    const name = (u && u.name) || localStorage.getItem('pbl.name') || '나';
    await enterApp(creds, name);
    keepSave(creds, name);
  } catch {
    CREDS = null;
    $('err').textContent = '아이디 또는 비밀번호가 올바르지 않습니다.';
  } finally { btn.disabled = false; }
});

/* 자동 해제 — 저장된 자격이 살아 있으면 폼을 거치지 않는다. 실패하면 무조건 레코드를 지우고 폼으로. */
(async () => {
  const hinted = +(localStorage.getItem('pbl.keep') || 0) > Date.now();
  if (hinted) showWait();
  const k = await keepLoad();
  if (k) {
    if (!hinted) showWait();
    try {
      const name = k.name || localStorage.getItem('pbl.name') || '나';
      await enterApp(k.creds, name);
      keepSave(k.creds, name);   // 슬라이딩 — 쓸 때마다 만료를 다시 하루 뒤로
      return;
    } catch { CREDS = null; keepForget(); }
  }
  showForm();
})();

/* 앱(iframe)과의 복호화 브리지 */
window.addEventListener('message', async e => {
  const m = e.data || {};
  if (m.t === 'getdoc') {
    const reply = html => $('app').contentWindow.postMessage({t:'dochtml', src:m.src, html}, '*');
    if (!CREDS || !/^docs\/[a-z0-9-]+\.enc\.json$/.test(m.src)) { reply('<p style="font-family:sans-serif;padding:20px">문서를 열 수 없습니다.</p>'); return; }
    try { reply(await decryptDoc(m.src)); }
    catch { reply('<p style="font-family:sans-serif;padding:20px">복호화 실패</p>'); }
  }
  if (m.t === 'lock') {
    CREDS = null; Object.keys(cache).forEach(k => delete cache[k]);
    keepForget();   // 🔒는 「이 기기에서 그만」이다 — 유지 레코드를 남기면 버튼이 무의미해진다
    const app = $('app'); app.srcdoc = ''; app.style.display = 'none';
    $('gate').style.display = 'flex'; $('upw').value = ''; showForm();
  }
});
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js');
</script>
</body>
</html>
